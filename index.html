
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خرافة أم حقيقة؟</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17152f, #45316d);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 520px;
  background: #ffffff14;
  padding: 30px 22px;
  border-radius: 25px;
  border: 1px solid #ffffff30;
  box-shadow: 0 10px 40px #0005;
}

h1 {
  color: #ffda79;
  font-size: 30px;
}

p {
  font-size: 18px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px 25px;
  margin: 9px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.06);
}

.start {
  background: #ffda79;
  color: #292044;
}

.truth {
  background: #63d9a5;
  color: #163d30;
  width: 80%;
}

.myth {
  background: #ff8296;
  color: #4c1726;
  width: 80%;
}

.hidden {
  display: none;
}

#feedback {
  font-size: 23px;
  font-weight: bold;
  margin-top: 20px;
}

#explanation {
  font-size: 17px;
}

#score {
  color: #ffda79;
}

#confetti {
  font-size: 35px;
}
</style>
</head>

<body>

<div class="container">

  <div id="home">
    <h1>✨ خرافة أم حقيقة؟ ✨</h1>
    <p>هل تستطيعين التمييز بين الحقيقة والخرافة؟</p>
    <button class="start" onclick="startGame()">ابدأ اللعب 🎮</button>
  </div>

  <div id="game" class="hidden">
    <p id="progress"></p>
    <h2 id="question"></h2>

    <button class="truth" onclick="answer(true)">حقيقة</button>
    <br>
    <button class="myth" onclick="answer(false)">خرافة</button>

    <div id="feedback"></div>
    <div id="confetti"></div>
    <p id="explanation"></p>

    <button id="next" class="start hidden"
      onclick="nextQuestion()">السؤال التالي ←</button>
  </div>

  <div id="result" class="hidden">
    <h1>🏆 انتهت اللعبة!</h1>
    <p id="finalScore"></p>
    <p id="finalMessage"></p>
    <button class="start" onclick="startGame()">العب مرة أخرى 🔄</button>
  </div>

</div>

<script>

// ✨ أضيفي أسئلتك هنا ✨
// correct: true = حقيقة
// correct: false = خرافة

const questions = [

  // اكتبي أسئلتك هنا بهذا الشكل:
  // {
  //   question: "اكتبي السؤال هنا",
  //   correct: true,
  //   explanation: "اكتبي التفسير هنا"
  // },

];

let current = 0;
let score = 0;
let answered = false;

function startGame() {

  if (questions.length === 0) {
    alert("أضيفي أسئلتك أولاً داخل الكود!");
    return;
  }

  current = 0;
  score = 0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {

  answered = false;

  const q = questions[current];

  document.getElementById("progress").innerText =
    `السؤال ${current + 1} من ${questions.length}`;

  document.getElementById("question").innerText = q.question;

  document.getElementById("feedback").innerText = "";
  document.getElementById("explanation").innerText = "";
  document.getElementById("confetti").innerText = "";

  document.getElementById("next").classList.add("hidden");

  document.querySelectorAll(".truth, .myth").forEach(btn => {
    btn.disabled = false;
    btn.style.opacity = "1";
  });
}

function answer(choice) {

  if (answered) return;
  answered = true;

  const q = questions[current];
  const correct = choice === q.correct;

  if (correct) {

    score++;

    document.getElementById("feedback").innerText =
      "🎉 إجابة صحيحة! أحسنتِ!";

    document.getElementById("confetti").innerText =
      "🎊 🎉 ✨ 🎊";

    playSound(700);

  } else {

    document.getElementById("feedback").innerText =
      "❌ إجابة خاطئة!";

    document.getElementById("confetti").innerText =
      "💔 😢";

    playSound(180);
  }

  document.getElementById("explanation").innerText =
    q.explanation || "";

  document.querySelectorAll(".truth, .myth").forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = "0.5";
  });

  const next = document.getElementById("next");

  next.classList.remove("hidden");

  next.innerText =
    current === questions.length - 1
    ? "عرض النتيجة 🏆"
    : "السؤال التالي ←";
}

function nextQuestion() {

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("finalScore").innerText =
    `نتيجتك: ${score} من ${questions.length}`;

  document.getElementById("finalMessage").innerText =
    score === questions.length
    ? "مذهل! كل إجاباتك صحيحة! 👑"
    : "شكراً لمشاركتك! حاولي مرة أخرى 💗";
}

function playSound(frequency) {

  try {
    const audio = new AudioContext();
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = frequency;
    gain.gain.value = 0.1;

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.2);
  } catch (e) {}
}

</script>

</body>
  </html>
